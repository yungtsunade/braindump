<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brain Dump</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brain Dump">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-d2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-d2.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* VOICE: still, aufgeräumt, wie eine leere Zeitungsseite
   IDEA: ein weißes Blatt; alles andere tritt nur auf, wenn man es braucht
   PICTURE: der Text selbst, groß gesetzt, auf Weiß
   COLOUR and TYPE: Schwarz auf Weiß, Grau für Nebensachen; Source Serif 4 überall
   LAYOUT: eine Spalte, viel Luft, feine Linien statt Kästen */
:root{--ink:#1a1a1a;--soft:#6f6f6f;--faint:#b5b5b5;--line:#e6e6e6;--wash:#f6f6f4;--serif:'Source Serif 4',Georgia,'Times New Roman',serif;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:#fff}
body{background:#fff;color:var(--ink);font:17px/1.5 var(--serif);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:var(--serif)}
.app{height:100dvh;display:flex;flex-direction:column}
header{max-width:680px;width:100%;margin:0 auto;padding:calc(44px + env(safe-area-inset-top)) 24px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:32px;line-height:1.1;font-weight:600;letter-spacing:-.01em}
.hs{font-size:15px;color:var(--soft);white-space:nowrap}
main{flex:1;min-height:0;overflow-y:auto}
.wrap{max-width:680px;margin:0 auto;padding:16px 24px 40px;display:flex;flex-direction:column;gap:28px}
.lab{display:block;font-size:14px;color:var(--soft);margin-bottom:8px}
.txt{margin:0;font-size:16px;line-height:1.55;color:var(--soft)}
.empty{font-size:17px;color:var(--soft);padding:8px 0}
.sec{display:flex;flex-direction:column;gap:14px;padding-top:22px;border-top:1px solid var(--line)}
.sec h2{margin:0;font-size:19px;font-weight:600}
/* Knöpfe */
.btn{font:600 16px var(--serif);color:#fff;background:var(--ink);border:1px solid var(--ink);min-height:46px;padding:0 24px;border-radius:23px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.out{background:#fff;color:var(--ink)}
.btn.link{background:none;border-color:transparent;color:var(--ink);padding:0 4px;font-weight:400;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.btn:disabled{opacity:.35;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:15px var(--serif);color:var(--ink);background:#fff;border:1px solid #d4d4d4;min-height:40px;padding:0 16px;border-radius:20px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.end{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
:is(.btn,.chip,.cb,.ic,.mk,nav button,.tg):focus-visible{outline:2px solid var(--ink);outline-offset:3px}
input[type=text],input[type=date],input[type=time],textarea.f{font:18px var(--serif);color:var(--ink);background:#fff;border:0;border-bottom:1px solid #cfcfcf;padding:8px 0;min-height:44px;width:100%;outline:none;border-radius:0}
textarea.f{border:1px solid #cfcfcf;padding:10px;font-size:14px;resize:vertical}
input:focus,textarea.f:focus{border-color:var(--ink)}
/* Fortschritt */
.prog{height:3px;background:var(--line);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
/* Sortieren */
.q{margin:0;font-size:30px;line-height:1.25;font-weight:400;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft)}
.marks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;background:#fff;border:1px solid #d4d4d4;border-radius:14px;font:15px/1.25 var(--serif);color:var(--ink);cursor:pointer;text-align:center}
.mk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.panel{display:flex;flex-direction:column;gap:18px;padding:22px;background:var(--wash);border-radius:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.panel input{background:transparent}
/* Listen */
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:18px;line-height:1.35}
.row .rt{flex:1;overflow-wrap:anywhere}
.tap{background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.tap>span:first-child{display:block}
.tap:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.row.done .rt>span:first-child{text-decoration:line-through;color:var(--faint)}
.sub{display:block;font-size:14px;color:var(--soft);margin-top:2px}
.mi{color:var(--soft);display:grid;place-items:center}
.cb{width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--ink);border-radius:50%;background:#fff;color:#fff;cursor:pointer;padding:0;display:grid;place-items:center}
.cb.on{background:var(--ink)}
.ic{border:0;background:transparent;color:var(--soft);width:44px;height:44px;flex:0 0 44px;cursor:pointer;display:grid;place-items:center;padding:0;margin:-8px -12px -8px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 16px 40px;border-bottom:1px solid var(--line)}
.acts .btn{min-height:38px;font-size:14px;padding:0 16px}
.pick{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
.pick:last-child{border-bottom:0}
.pick .rt{flex:1;overflow-wrap:anywhere}
.add{width:36px;height:36px;flex:0 0 36px;border-radius:50%;border:1px solid #d4d4d4;background:#fff;color:var(--ink);font:22px/1 var(--serif);cursor:pointer;display:grid;place-items:center;padding:0}
/* Erledigt */
.big{display:flex;align-items:baseline;gap:14px}
.big b{font-size:64px;line-height:1;font-weight:600}
.big span{font-size:17px;color:var(--soft)}
.quote{margin:0;font-style:italic;font-size:18px;line-height:1.5;color:var(--soft)}
.gl{font-size:14px;color:var(--soft);margin:18px 0 2px}
.row .d{font-size:14px;color:var(--faint);white-space:nowrap}
/* Leiste */
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{font:13px var(--serif);color:#8a8a8a;background:transparent;border:0;flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0 2px}
nav button.on{color:var(--ink);font-weight:600}
/* Dump: leeres Blatt */
.tg{display:none}
#ta{display:block;width:100%;max-width:680px;height:100%;margin:0 auto;border:0;outline:none;resize:none;background:transparent;color:var(--ink);font:20px/1.7 var(--serif);padding:calc(72px + env(safe-area-inset-top)) 24px 140px;caret-color:var(--ink)}
#ta::placeholder{color:#c4c4c4}
body.blank header{display:none}
body.blank main{overflow:hidden}
body.blank .tg{display:grid;place-items:center;position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border:0;background:transparent;color:var(--faint);cursor:pointer;z-index:5}
body.blank.ov .tg{color:var(--ink)}
body.blank nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:4}
body.blank.ov nav{display:flex}
.dfoot{display:none}
body.blank.ov .dfoot{display:flex;position:fixed;right:20px;left:20px;bottom:calc(76px + env(safe-area-inset-bottom));justify-content:flex-end;align-items:center;gap:16px;z-index:4;pointer-events:none}
.dfoot>*{pointer-events:auto}
#tm{font-size:15px;color:#8a8a8a}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font:15px var(--serif);padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
#toast.s{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="hd">Brain Dump</h1><span class="hs" id="hs"></span></header>
  <main id="main"></main>
  <nav id="nav" aria-label="Bereiche"></nav>
</div>
<button id="tg" class="tg" data-act="ov" aria-label="Leiste einblenden" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"/></svg></button>
<div id="toast" role="status"></div>
<script>
{
const KEY='braindump-v1';
const fresh=()=>({items:[],lists:[{id:'heute',name:'Heute',max:5}],draft:'',tab:'dump',cur:'heute',timer:5,batch:[],undo:[]});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=fresh()}
S.lists.forEach(l=>{if(l.id==='heute'&&l.name==='HEUTE')l.name='Heute'});delete S.look;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const U={panel:null,pick:{},open:null,newList:false,confirm:null,timerEnd:null,ov:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const find=id=>S.items.find(i=>i.id===id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(n,b=new Date())=>{const d=new Date(b);d.setDate(d.getDate()+n);return d};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const fmtD=s=>{if(!s)return'';const d=parseD(s);return WD[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
const stamp=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
let tz='Europe/Berlin';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}

const sv=(p,s=22,w=1.6)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
 circle:(s,w)=>sv('<circle cx="12" cy="12" r="8"/>',s,w),
 star:(s,w)=>sv('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',s,w),
 next:(s,w)=>sv('<path d="M4 12h15M13 6l6 6-6 6"/>',s,w),
 check:()=>sv('<path d="M6 12.5l4 4L18 8"/>',14,2.6),
 dots:()=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
 x:()=>sv('<path d="M6 6l12 12M18 6L6 18"/>',18,1.8)
};
const TABS=[['dump','Dump','<path d="M4 20h4L19 9l-4-4L4 16z"/>'],['sort','Sortieren','<path d="M4 7h16M7 12h10M10 17h4"/>'],
['lists','Listen','<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="18" r=".6"/>'],['done','Erledigt','<path d="M5 12.5l4.5 4.5L19 7"/>'],
['opt','Optionen','<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>']];

let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),2200)};

function calLink(it){
 let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(it.text);
 if(it.mark==='circle'&&it.date){const d=it.date.replace(/-/g,'');u+='&dates='+d+'/'+iso(addD(1,parseD(it.date))).replace(/-/g,'')}
 if(it.mark==='star'&&it.date&&it.time){const s=new Date(it.date+'T'+it.time);const e=new Date(s.getTime()+(it.dur||60)*60000);u+='&dates='+stamp(s)+'/'+stamp(e)+'&ctz='+encodeURIComponent(tz)}
 return u+'&details='+encodeURIComponent('Aus dem Brain Dump');
}
const subOf=it=>it.replan&&!it.mark?'Nächsten Schritt planen':it.mark==='circle'?fmtD(it.date):it.mark==='star'?`${fmtD(it.date)}, ${it.time} Uhr, ${it.dur} Min.`:it.mark==='next'?'Nächster Schritt: '+it.next:'';
const rank=it=>({circle:0,star:1,next:2}[it.mark]??3);
const sorted=a=>a.slice().sort((x,y)=>rank(x)-rank(y)||String(x.date||'').localeCompare(String(y.date||''))||x.created-y.created);
const isToday=t=>t&&iso(new Date(t))===iso(new Date());
const markIc=i=>i.mark?`<span class="mi" title="${{circle:'Datum',star:'Zeitslot',next:'Nächster Schritt'}[i.mark]}">${I[i.mark](18)}</span>`:'';

function renderNav(){$('#nav').innerHTML=TABS.map(([k,l,p])=>`<button data-act="tab" data-v="${k}" class="${S.tab===k?'on':''}" aria-current="${S.tab===k?'page':'false'}">${sv(p,20,S.tab===k?2:1.6)}${l}</button>`).join('')}

function render(){
 document.body.classList.toggle('blank',S.tab==='dump');if(S.tab!=='dump')ovSet(false);
 renderNav();$('#hs').textContent='';
 ({dump:vDump,sort:vSort,lists:vLists,done:vDone,opt:vOpt})[S.tab]();
 $('#main').scrollTop=0;
}
const page=(title,html)=>{$('#hd').textContent=title;$('#main').innerHTML=`<div class="wrap">${html}</div>`};

/* ---------- DUMP ---------- */
function ovSet(on){U.ov=on;document.body.classList.toggle('ov',on);const t=$('#tg');t.setAttribute('aria-expanded',on);t.setAttribute('aria-label',on?'Leiste ausblenden':'Leiste einblenden')}
function vDump(){
 $('#hd').textContent='Brain Dump';
 $('#main').innerHTML=`<label for="ta" class="sr">Gedanken</label>
  <textarea id="ta" placeholder="Was geht dir durch den Kopf?" spellcheck="true"></textarea>
  <div class="dfoot"><span id="tm"></span><button class="btn" data-act="finish">Fertig</button></div>`;
 ovSet(!!U.ov);
 const ta=$('#ta');ta.value=S.draft;tick();
 ta.addEventListener('focus',()=>{if(!ta.value){ta.value='• ';S.draft=ta.value}});
 ta.addEventListener('input',()=>{
  const p=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',p-1)+1;
  const m=v.slice(ls,p).match(/^([-*]|\d+\.)\s$/);
  if(m){ta.value=v.slice(0,ls)+'• '+v.slice(p);ta.selectionStart=ta.selectionEnd=ls+2}
  S.draft=ta.value;save();
  if(!U.timerEnd&&S.timer){U.timerEnd=Date.now()+S.timer*60000;tick()}
 });
 ta.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  e.preventDefault();
  const p=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',p-1)+1,line=v.slice(ls,p);
  if(/^•\s*$/.test(line))return;
  ta.setRangeText('\n• ',p,ta.selectionEnd,'end');S.draft=ta.value;save();
 });
}
function tick(){const t=$('#tm');if(!t)return;
 if(!S.timer){t.textContent='';return}
 if(!U.timerEnd){t.textContent=S.timer+':00';return}
 const r=Math.max(0,Math.round((U.timerEnd-Date.now())/1000));
 t.textContent=r?Math.floor(r/60)+':'+pad(r%60):'Zeit um';t.style.color=r?'':'var(--ink)'}
setInterval(tick,1000);

/* ---------- SORTIEREN ---------- */
const curItem=()=>U.planId?find(U.planId):S.items.find(i=>i.status==='unsorted');
function startPick(k,it){const n=new Date();n.setHours(n.getHours()+1,0,0,0);
 const same=it&&it.mark===k;
 U.pick={date:same&&it.date||iso(new Date()),time:same&&it.time||pad(n.getHours())+':00',dur:same&&it.dur||60,next:''}}
function vPlan(){
 const it=find(U.planId);if(!it){U.planId=null;S.tab='lists';return render()}
 const mk=(k,l)=>`<button class="mk ${U.panel===k?'on':''}" data-act="panel" data-v="${k}" aria-pressed="${U.panel===k}">${I[k](26,1.6)}${l}</button>`;
 page('Planen',`<div style="display:flex;flex-direction:column;gap:22px">
   <div class="meta"><span>${it.mark?'Aktuell: '+esc({circle:'Datum',star:'Zeitslot',next:'Nächster Schritt'}[it.mark])+(subOf(it)?', '+esc(subOf(it)):''):'Noch ohne Markierung'}</span></div>
   <p class="q">${esc(it.text)}</p>
   <div class="marks">${mk('circle','Datum')}${mk('star','Zeitslot')}${mk('next','Nächster Schritt')}</div>
  </div>
  ${panel(it)}
  <div class="row2"><button class="btn link" data-act="planBack">Abbrechen</button>${it.mark?'<button class="btn link" data-act="unmark">Markierung entfernen</button>':''}</div>`);
 const t=$('#nx');if(t)t.focus();
}
function vSort(){
 if(U.planId)return vPlan();
 const q=S.items.filter(i=>i.status==='unsorted');
 const total=S.batch.length,doneN=S.batch.filter(id=>{const x=find(id);return !x||x.status!=='unsorted'}).length;
 if(!q.length){page('Sortieren',`<p class="quote">Alles einsortiert. Dein Kopf ist leer, die Gedanken sind geparkt.</p>
  <div class="row2"><button class="btn out" data-act="tab" data-v="dump">Neuer Dump</button><button class="btn" data-act="tab" data-v="lists">Zu den Listen</button></div>`);return}
 const it=q[0],n=Math.min(doneN+1,total||1);
 if(total)$('#hs').textContent=n+' von '+total;
 const mk=(k,l)=>`<button class="mk ${U.panel===k?'on':''}" data-act="panel" data-v="${k}" aria-pressed="${U.panel===k}">${I[k](26,1.6)}${l}</button>`;
 page('Sortieren',`${total?`<div class="prog" role="img" aria-label="${doneN} von ${total} sortiert"><i style="width:${Math.round(doneN/total*100)}%"></i></div>`:''}
  <div style="display:flex;flex-direction:column;gap:22px">
   <div class="meta"><span>Punkt ${n}${total?' von '+total:''}</span><button class="ic" data-act="del" data-id="${it.id}" aria-label="Punkt löschen" style="margin:-10px -12px -10px 0">${I.x()}</button></div>
   <p class="q">${esc(it.text)}</p>
   <div class="marks">${mk('circle','Datum')}${mk('star','Zeitslot')}${mk('next','Nächster Schritt')}</div>
  </div>
  ${panel(it)}
  <div class="row2"><button class="btn link" data-act="undo" ${S.undo.length?'':'disabled'}>Zurück</button><button class="btn link" data-act="nomark">Ohne Markierung weiter</button></div>`);
 const t=$('#nx');if(t)t.focus();
}
function dateChips(){const P=U.pick;const opts=[[iso(new Date()),'Heute'],[iso(addD(1)),'Morgen'],[iso(addD(2)),'Übermorgen']];
 return `<div class="chips">${opts.map(([v,l])=>`<button class="chip ${P.date===v?'on':''}" data-act="pick" data-k="date" data-v="${v}">${l}</button>`).join('')}</div>
 <label><span class="lab">Oder ein anderes Datum</span><input type="date" data-pick="date" value="${P.date||''}"></label>`}
function panel(it){
 if(!U.panel)return'';
 const P=U.pick,draft=Object.assign({},it,{mark:U.panel},P);
 const save2=`<div class="row2"><button class="btn link" data-act="saveMark">Nur speichern</button><a class="btn" data-act="saveCal" href="${esc(calLink(draft))}" target="_blank" rel="noopener">Speichern und in Kalender</a></div>`;
 if(U.panel==='circle')return `<div class="panel"><span class="lab" style="margin:0">Wann ist es dran?</span>${dateChips()}${save2}</div>`;
 if(U.panel==='star')return `<div class="panel"><span class="lab" style="margin:0">Wann erledigst du es?</span>${dateChips()}
  <div class="two"><label><span class="lab">Uhrzeit</span><input type="time" data-pick="time" value="${P.time}"></label>
  <div><span class="lab">Dauer (Min.)</span><div class="chips">${[30,60,90].map(m=>`<button class="chip ${P.dur===m?'on':''}" data-act="pick" data-k="dur" data-v="${m}">${m}</button>`).join('')}</div></div></div>${save2}</div>`;
 return `<div class="panel"><label><span class="lab">Erster Schritt, als Verb und Ding, z. B. „Kontoauszug suchen“</span><input type="text" id="nx" value="${esc(P.next||'')}" enterkeyhint="done"></label>
  <div class="end"><button class="btn" data-act="saveMark">Speichern</button></div></div>`;
}
function settle(it,mark){
 const plan=!!U.planId;
 delete it.date;delete it.time;delete it.dur;delete it.next;delete it.replan;
 it.status='open';it.mark=mark;
 if(mark==='circle'){it.date=U.pick.date}
 if(mark==='star'){it.date=U.pick.date;it.time=U.pick.time;it.dur=U.pick.dur}
 if(mark==='next'){it.next=U.pick.next}
 if(!plan)S.undo.push(it.id);U.panel=null;save();
 if(plan){U.planId=null;S.tab='lists';toast('Geplant')}
}

/* ---------- LISTEN ---------- */
function vLists(){
 const open=S.items.filter(i=>i.status==='open');
 if(S.cur!=='master'&&!S.lists.some(l=>l.id===S.cur))S.cur='heute';
 const cnt=l=>open.filter(i=>i.lists.includes(l.id)).length;
 const chips=`<button class="chip ${S.cur==='master'?'on':''}" data-act="list" data-v="master">Masterliste ${open.length}</button>`
  +S.lists.map(l=>`<button class="chip ${S.cur===l.id?'on':''}" data-act="list" data-v="${l.id}">${esc(l.name)} ${cnt(l)}${l.max?'/'+l.max:''}</button>`).join('')
  +`<button class="chip" data-act="newList" aria-label="Neue Liste">+</button>`;
 const nl=U.newList?`<div class="panel"><label><span class="lab">Name der neuen Liste</span><input type="text" id="nl" maxlength="24" enterkeyhint="done"></label><div class="row2"><button class="btn link" data-act="newList">Abbrechen</button><button class="btn" data-act="mkList">Anlegen</button></div></div>`:'';
 let body='';
 if(S.cur==='master'){
  body=open.length?`<div class="rows">${sorted(open).map(i=>row(i,'master')).join('')}</div>`:'<p class="empty">Noch nichts geparkt. Starte mit einem Dump.</p>';
 }else{
  const L=S.lists.find(l=>l.id===S.cur);
  const inL=S.items.filter(i=>i.lists.includes(L.id)&&(i.status==='open'||(i.status==='done'&&isToday(i.doneAt))));
  const dn=inL.filter(i=>i.status==='done').length,full=L.max&&cnt(L)>=L.max;
  const cand=sorted(open.filter(i=>!i.lists.includes(L.id)));
  if(inL.length)$('#hs').textContent=dn+' von '+inL.length+' erledigt';
  body=`${inL.length?`<div class="prog" role="img" aria-label="${dn} von ${inL.length} erledigt"><i style="width:${Math.round(dn/inL.length*100)}%"></i></div>
   <div class="rows">${sorted(inL.filter(i=>i.status==='open')).concat(inL.filter(i=>i.status==='done')).map(i=>row(i,'list')).join('')}</div>`:'<p class="empty">Noch leer. Hol dir unten etwas aus der Masterliste.</p>'}
   <div class="sec"><h2>Aus der Masterliste holen</h2>
   ${full?`<p class="txt">${esc(L.name)} ist voll. Erst etwas erledigen, dann nachlegen.</p>`:cand.length?`<div>${cand.map(i=>`<div class="pick">${markIc(i)}<span class="rt">${esc(i.text)}${subOf(i)?`<span class="sub">${esc(subOf(i))}</span>`:''}</span><button class="add" data-act="addTo" data-id="${i.id}" data-v="${L.id}" aria-label="Zu ${esc(L.name)} hinzufügen">+</button></div>`).join('')}</div>`:'<p class="txt">Nichts mehr da, alles ist schon in dieser Liste.</p>'}</div>
   ${L.id!=='heute'?`<div class="end"><button class="btn link" data-act="delList">${U.confirm==='list'?'Wirklich löschen?':'Liste löschen'}</button></div>`:''}`;
 }
 page('Listen',`<div class="chips">${chips}</div>${nl}${body}`);
 if(U.newList)$('#nl').focus();
}
function row(i,ctx){
 const done=i.status==='done',sub=subOf(i);
 let acts='';
 if(U.open===i.id){
  const ls=ctx==='master'?S.lists.filter(l=>!i.lists.includes(l.id)).map(l=>`<button class="btn out" data-act="addTo" data-id="${i.id}" data-v="${l.id}">Zu ${esc(l.name)}</button>`).join(''):`<button class="btn out" data-act="rmFrom" data-id="${i.id}">Aus Liste nehmen</button>`;
  const cal=(i.mark==='circle'||i.mark==='star')?`<a class="btn out" href="${esc(calLink(i))}" target="_blank" rel="noopener">Kalender</a>`:'';
  const full=i.mark==='next'?`<button class="btn out" data-act="fullDone" data-id="${i.id}">Ganze Aufgabe erledigt</button>`:'';
  acts=`<div class="acts">${ls}${cal}${full}<button class="btn" data-act="del" data-id="${i.id}">${U.confirm===i.id?'Wirklich löschen?':'Löschen'}</button></div>`;
 }
 return `<div class="row ${done?'done':''}"><button class="cb ${done?'on':''}" data-act="toggle" data-id="${i.id}" aria-label="${done?'Wieder öffnen':'Abhaken'}">${done?I.check():''}</button>
  <button class="rt tap" data-act="plan" data-id="${i.id}" ${done?'disabled':''}><span>${esc(i.text)}</span>${sub?`<span class="sub">${esc(sub)}</span>`:''}</button>${markIc(i)}
  <button class="ic" data-act="more" data-id="${i.id}" aria-label="Aktionen" aria-expanded="${U.open===i.id}">${I.dots()}</button></div>${acts}`;
}

/* ---------- ERLEDIGT ---------- */
function vDone(){
 const d=S.items.filter(i=>i.status==='done').sort((a,b)=>b.doneAt-a.doneAt);
 const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
 const wk=d.filter(i=>i.doneAt>=mon.getTime()).length;
 const lbl=t=>{const x=new Date(t),s=iso(x);return s===iso(new Date())?'Heute':s===iso(addD(-1))?'Gestern':WDL[x.getDay()]+', '+x.getDate()+'.'+(x.getMonth()+1)+'.'};
 let last='',list='';
 for(const i of d){const l=lbl(i.doneAt);if(l!==last){list+=`${last?'</div>':''}<div class="gl">${l}</div><div class="rows">`;last=l}
  const t=new Date(i.doneAt);
  list+=`<div class="row"><button class="cb on" data-act="toggle" data-id="${i.id}" aria-label="Zurückholen">${I.check()}</button><span class="rt">${esc(i.text)}${i.kind==='step'?`<span class="sub">Schritt zu: ${esc(i.of)}</span>`:''}</span><span class="d">${pad(t.getHours())}:${pad(t.getMinutes())}</span></div>`}
 if(last)list+='</div>';
 page('Erledigt',`<div class="big"><b>${wk}</b><span>diese Woche erledigt</span></div>
  <p class="quote">Dein Beweisglas. Lies drei davon, bevor du etwas Schweres anfängst.</p>
  <div>${list||'<p class="empty">Hier landet alles, was du abhakst.</p>'}</div>`);
}

/* ---------- OPTIONEN ---------- */
function vOpt(){
 const ch=(act,v,l,on)=>`<button class="chip ${on?'on':''}" data-act="${act}" data-v="${v}">${l}</button>`;
 page('Optionen',`<div class="sec" style="border:0;padding:0"><h2>Dump-Timer</h2><div class="chips">${ch('timer',5,'5 Minuten',S.timer===5)}${ch('timer',10,'10 Minuten',S.timer===10)}${ch('timer',0,'Aus',!S.timer)}</div></div>
 <div class="sec"><h2>Sicherung</h2><p class="txt">Deine Daten liegen nur auf diesem Gerät. Kopiere ab und zu eine Sicherung, zum Beispiel in eine Notiz.</p>
  <div><button class="btn out" data-act="copy">Sicherung kopieren</button></div>
  <label><span class="lab">Sicherung einfügen</span><textarea class="f" id="imp" rows="3"></textarea></label>
  <div><button class="btn out" data-act="imp">Wiederherstellen</button></div></div>
 <div class="sec"><h2>Alles löschen</h2><div><button class="btn" data-act="wipe">${U.confirm==='wipe'?'Wirklich alles löschen?':'Alle Daten löschen'}</button></div></div>`);
}

/* ---------- AKTIONEN ---------- */
const A={
 ov:()=>{ovSet(!U.ov)},
 tab:el=>{S.tab=el.dataset.v;U.planId=null;U.panel=null;U.open=null;U.confirm=null;save();render()},
 finish:()=>{
  const lines=S.draft.split('\n').map(l=>l.replace(/^\s*(•|[-*]|\d+\.)\s*/,'').trim()).filter(Boolean);
  if(!lines.length){toast('Noch nichts aufgeschrieben');return}
  ovSet(false);
  const now=Date.now();
  lines.forEach((t,k)=>S.items.push({id:uid(),text:t,created:now+k,status:'unsorted',mark:null,lists:[]}));
  S.batch=S.items.filter(i=>i.status==='unsorted').map(i=>i.id);S.undo=[];
  S.draft='';U.timerEnd=null;S.tab='sort';save();render();
 },
 panel:el=>{const k=el.dataset.v;if(U.panel===k){U.panel=null}else{U.panel=k;startPick(k,U.planId&&find(U.planId))}vSort()},
 plan:el=>{U.planId=el.dataset.id;U.panel=null;U.open=null;U.confirm=null;S.tab='sort';save();render()},
 planBack:()=>{U.planId=null;U.panel=null;S.tab='lists';save();render()},
 unmark:()=>{const it=find(U.planId);if(it){it.mark=null;delete it.date;delete it.time;delete it.dur;delete it.next}U.planId=null;U.panel=null;S.tab='lists';save();render()},
 fullDone:el=>{const it=find(el.dataset.id);if(!it)return;it.status='done';it.doneAt=Date.now();U.open=null;save();render();toast('Erledigt. Ab ins Beweisglas.')},
 pick:el=>{const k=el.dataset.k;U.pick[k]=k==='dur'?Number(el.dataset.v):el.dataset.v;vSort()},
 saveCal:()=>{const it=curItem();if(!it)return;
  if(!U.pick.date){toast('Bitte ein Datum wählen');return}
  settle(it,U.panel);setTimeout(()=>{render();toast('Gespeichert, Kalender geöffnet')},60)},
 saveMark:()=>{const it=curItem();if(!it)return;
  if(U.panel==='next'){U.pick.next=($('#nx').value||'').trim();if(!U.pick.next){toast('Schreib den ersten Schritt auf');return}}
  else if(!U.pick.date){toast('Bitte ein Datum wählen');return}
  settle(it,U.panel);render()},
 nomark:()=>{const it=S.items.find(i=>i.status==='unsorted');if(!it)return;it.status='open';it.mark=null;S.undo.push(it.id);U.panel=null;save();vSort()},
 undo:()=>{const id=S.undo.pop();const it=find(id);if(it){it.status='unsorted';it.mark=null;delete it.date;delete it.time;delete it.dur;delete it.next}U.panel=null;save();vSort()},
 del:el=>{const id=el.dataset.id;
  if(S.tab!=='sort'&&U.confirm!==id){U.confirm=id;render();return}
  S.items=S.items.filter(i=>i.id!==id);S.undo=S.undo.filter(x=>x!==id);U.confirm=null;U.open=null;U.panel=null;save();render()},
 toggle:el=>{const it=find(el.dataset.id);if(!it)return;
  if(it.kind==='step'){const p=find(it.parent);if(p&&p.status==='open'&&!p.mark){p.mark='next';p.next=it.text;delete p.replan}S.items=S.items.filter(x=>x.id!==it.id);U.open=null;save();render();return}
  if(it.status==='done'){it.status='open';delete it.doneAt}
  else if(it.mark==='next'){
   S.items.push({id:uid(),kind:'step',parent:it.id,text:it.next,of:it.text,created:Date.now(),status:'done',doneAt:Date.now(),mark:null,lists:[]});
   it.mark=null;delete it.next;it.replan=true;toast('Schritt erledigt. Plane den nächsten.')}
  else{it.status='done';it.doneAt=Date.now();toast('Erledigt. Ab ins Beweisglas.')}
  U.open=null;save();render()},
 more:el=>{U.open=U.open===el.dataset.id?null:el.dataset.id;U.confirm=null;vLists()},
 list:el=>{S.cur=el.dataset.v;U.open=null;U.confirm=null;save();vLists()},
 newList:()=>{U.newList=!U.newList;vLists()},
 mkList:()=>{const n=($('#nl').value||'').trim();if(!n){toast('Gib der Liste einen Namen');return}
  const id=uid();S.lists.push({id,name:n.slice(0,24)});S.cur=id;U.newList=false;save();vLists()},
 delList:()=>{if(U.confirm!=='list'){U.confirm='list';vLists();return}
  const id=S.cur;S.lists=S.lists.filter(l=>l.id!==id);S.items.forEach(i=>i.lists=i.lists.filter(x=>x!==id));S.cur='heute';U.confirm=null;save();vLists()},
 addTo:el=>{const it=find(el.dataset.id),L=S.lists.find(l=>l.id===el.dataset.v);if(!it||!L)return;
  if(L.max&&S.items.filter(i=>i.status==='open'&&i.lists.includes(L.id)).length>=L.max){toast(L.name+' ist voll');return}
  it.lists.push(L.id);U.open=null;save();vLists();if(S.cur==='master')toast('Zu '+L.name+' hinzugefügt')},
 rmFrom:el=>{const it=find(el.dataset.id);if(it)it.lists=it.lists.filter(x=>x!==S.cur);U.open=null;save();vLists()},
 timer:el=>{S.timer=Number(el.dataset.v);U.timerEnd=null;save();vOpt()},
 copy:async()=>{const data=JSON.stringify({v:1,items:S.items,lists:S.lists});
  try{await navigator.clipboard.writeText(data);toast('Sicherung kopiert')}catch(e){$('#imp').value=data;$('#imp').select();toast('Kopieren blockiert: Text ist markiert, bitte selbst kopieren')}},
 imp:()=>{try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.items)||!Array.isArray(d.lists))throw 0;
  S.items=d.items;S.lists=d.lists.some(l=>l.id==='heute')?d.lists:[{id:'heute',name:'Heute',max:5}].concat(d.lists);save();toast('Wiederhergestellt');vOpt()}catch(e){toast('Das ist keine gültige Sicherung')}},
 wipe:()=>{if(U.confirm!=='wipe'){U.confirm='wipe';vOpt();return}S=fresh();S.tab='opt';U.confirm=null;save();render();toast('Alles gelöscht')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el,e)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.pick;if(k){U.pick[k]=e.target.value;vSort()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
 if(e.target.id==='nx'){e.preventDefault();A.saveMark()}
 if(e.target.id==='nl'){e.preventDefault();A.mkList()}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
