<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brain Dump</title>
<meta name="theme-color" content="#fff4e0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brain Dump">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* VOICE: freundlich, ruhig, verspielt – Writy-Familie
   IDEA: ein Pixel-Notizblock, der Gedanken parkt
   PICTURE: das Papierblatt selbst, auf Karomuster
   COLOUR and TYPE: Writy-Palette (Tag/Nacht/Matrix); Press Start 2P für UI, Atkinson Hyperlegible für Einträge
   LAYOUT: Handy zuerst, eine Spalte, Tab-Leiste unten */
:root{--ink:#3b2a4a;--soft:#6b5a7a;--bg:#ffe9d6;--dot:#f9dcc4;--paper:#fffaf0;--panel:#fff4e0;
--berry:#ff6f91;--mint:#6fd6b6;--mhi:#b8f2e0;--butter:#ffd166;--sky:#8ecae6;--lilac:#c3a6ff;--bt:#3b2a4a;
--ui:'Press Start 2P',monospace;--tx:'Atkinson Hyperlegible',system-ui,sans-serif}
body[data-look=nacht]{--ink:#f3e8ff;--soft:#b9a7cf;--bg:#1d1530;--dot:#251b3d;--paper:#2a2045;--panel:#2f2450;
--berry:#ff7aa2;--mint:#5cc9a7;--mhi:#3f6e66;--butter:#f7c65c;--sky:#6fb6d9;--lilac:#a98bff}
body[data-look=matrix]{--ink:#39ff6a;--soft:#1f9e45;--bg:#000;--dot:#021006;--paper:#010803;--panel:#03140a;
--berry:#7dffa0;--mint:#1fd655;--mhi:#0e4a20;--butter:#39ff6a;--sky:#22c55e;--lilac:#16a34a;--bt:#001a06}
body[data-look=matrix]{text-shadow:0 0 3px rgba(57,255,106,.5)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background-color:var(--bg);background-image:linear-gradient(45deg,var(--dot) 25%,transparent 25%,transparent 75%,var(--dot) 75%),linear-gradient(45deg,var(--dot) 25%,transparent 25%,transparent 75%,var(--dot) 75%);
background-size:16px 16px;background-position:0 0,8px 8px;color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:none}
.app{height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 10px;gap:10px}
h1{margin:0;font-size:13px;letter-spacing:1px;text-shadow:2px 2px 0 var(--berry)}
.hs{font-size:9px;color:var(--soft)}
main{flex:1;min-height:0;overflow-y:auto;padding:10px 22px 22px;display:flex;flex-direction:column;gap:20px}
.px{box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),8px 8px 0 0 rgba(59,42,74,.18);margin:4px}
.paper{background:var(--paper);display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:6px;height:38px;flex:0 0 38px;padding:0 12px;border-bottom:4px solid var(--ink);font-size:8px}
.bar i{width:10px;height:10px}.bar i:nth-child(1){background:var(--berry)}.bar i:nth-child(2){background:var(--butter)}.bar i:nth-child(3){background:var(--mint)}
.bar .t{margin-left:8px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{font-family:var(--ui);font-size:10px;line-height:1.3;color:var(--bt);background:var(--butter);border:0;cursor:pointer;padding:12px 14px;min-height:44px;margin:4px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;
box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 0 -4px 0 0 rgba(0,0,0,.18),inset 0 4px 0 0 rgba(255,255,255,.45)}
.btn:active,.btn.on{transform:translateY(2px);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 0 4px 0 0 rgba(0,0,0,.18)}
.btn:focus-visible,.chip:focus-visible,.cb:focus-visible,.ic:focus-visible,nav button:focus-visible{outline:3px dashed var(--berry);outline-offset:4px}
.btn:disabled{opacity:.45;cursor:default}
.mint{background:var(--mint)}.sky{background:var(--sky)}.lilac{background:var(--lilac)}.berry{background:var(--berry);color:#fff}
.ghost{background:var(--panel);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--ui);font-size:8px;line-height:1.3;border:0;min-height:40px;padding:0 12px;color:var(--ink);background:var(--panel);box-shadow:inset 0 0 0 3px var(--ink);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--berry);color:#fff}
body[data-look=matrix] .chip.on{color:var(--bt)}
input[type=text],input[type=date],input[type=time],textarea.f{font:16px var(--tx);color:var(--ink);background:var(--paper);border:0;box-shadow:inset 0 0 0 3px var(--ink);padding:10px 12px;min-height:44px;width:100%;outline:none;color-scheme:light}
body[data-look=nacht] input,body[data-look=matrix] input{color-scheme:dark}
input:focus,textarea.f:focus{box-shadow:inset 0 0 0 3px var(--berry)}
#ta{flex:1;width:100%;min-height:300px;border:0;outline:none;resize:none;background:transparent;color:var(--ink);font:18px/1.6 var(--tx);padding:20px;caret-color:var(--berry)}
#ta::placeholder{color:var(--soft)}
.hint{padding:0 20px 16px;font:14px/1.45 var(--tx);color:var(--soft)}
.end{display:flex;justify-content:flex-end}
.between{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.prog{display:flex;gap:4px;padding:4px;background:var(--panel);box-shadow:0 0 0 3px var(--ink);margin:3px}
.prog span{flex:1;height:12px;background:var(--dot)}.prog span.f{background:var(--berry)}.prog.g span.f{background:var(--mint)}
.card{background:var(--paper);padding:22px 20px 20px;display:flex;flex-direction:column;gap:18px;position:relative}
.card .q{margin:0;font:700 23px/1.3 var(--tx);overflow-wrap:anywhere}
.card .x{position:absolute;top:10px;right:10px}
.marks{display:flex;gap:10px}
.marks .btn{flex:1;flex-direction:column;padding:14px 4px;font-size:8px;gap:10px;margin:4px}
.panel{background:var(--paper);padding:18px;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;align-items:center;gap:10px;font-size:9px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lab{font-size:8px;display:block;margin-bottom:8px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:3px dashed var(--dot);font:17px/1.35 var(--tx)}
.row:last-child{border-bottom:0}
.row .rt{flex:1;overflow-wrap:anywhere}
.row.done .rt>span{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.sub{display:block;font-size:13px;color:var(--soft);margin-top:3px}
.cb{width:28px;height:28px;flex:0 0 28px;border:0;background:var(--paper);box-shadow:inset 0 0 0 3px var(--ink);cursor:pointer;padding:0;display:grid;place-items:center}
.cb.on{background:var(--mint)}
.ic{border:0;background:transparent;color:var(--ink);width:44px;height:44px;flex:0 0 44px;cursor:pointer;display:grid;place-items:center;padding:0;margin:-8px -10px -8px 0}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding:4px 10px 14px;background:var(--panel);border-bottom:3px dashed var(--dot)}
.acts .btn{font-size:8px;min-height:40px;padding:8px 10px}
.empty{font:15px/1.5 var(--tx);color:var(--soft);padding:16px}
.slip{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--paper);box-shadow:inset 0 0 0 3px var(--ink);font:16px/1.35 var(--tx)}
.slip .d{margin-left:auto;font:7px var(--ui);color:var(--soft);white-space:nowrap}
.gl{font-size:8px;margin-top:6px}
.jar{background:var(--mhi);padding:20px;display:flex;align-items:center;gap:18px}
.txt{margin:0;font:15px/1.5 var(--tx);color:var(--soft)}
.opt{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--paper)}
nav{display:flex;background:var(--panel);border-top:4px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{font-family:var(--ui);font-size:7px;color:var(--ink);background:transparent;border:0;flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:0 2px}
nav button.on{background:var(--mhi)}
body[data-look=nacht] nav button.on{color:#fff}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font:9px/1.4 var(--ui);padding:10px 14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.s{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
/* Dump: leere weiße Seite */
.tg{display:none}
body.blank{background:#fff;background-image:none;color:#1a1a1a;text-shadow:none;font-family:'Source Serif 4',Georgia,serif}
body.blank header{display:none}
body.blank .app{max-width:none}
body.blank main{padding:0;overflow:hidden}
body.blank #ta{max-width:680px;margin:0 auto;padding:72px 24px 120px;font:20px/1.7 'Source Serif 4',Georgia,serif;color:#1a1a1a;caret-color:#1a1a1a;min-height:0;height:100%}
body.blank #ta::placeholder{color:#c4c4c4}
body.blank .tg{display:grid;place-items:center;position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;width:44px;height:44px;border:0;background:transparent;color:#b5b5b5;cursor:pointer;z-index:5}
body.blank.ov .tg{color:#1a1a1a}
body.blank .tg:focus-visible{outline:2px solid #1a1a1a;outline-offset:2px}
body.blank nav{display:none;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #e6e6e6;z-index:4}
body.blank.ov nav{display:flex}
body.blank nav button{font:13px 'Source Serif 4',Georgia,serif;color:#8a8a8a;text-transform:none;letter-spacing:0;gap:6px}
body.blank nav button.on{background:none;color:#1a1a1a}
body.blank nav svg{stroke-width:1.6}
.dfoot{display:none}
body.blank.ov .dfoot{display:flex;position:fixed;right:20px;left:20px;bottom:calc(76px + env(safe-area-inset-bottom));justify-content:flex-end;align-items:center;gap:16px;z-index:4;pointer-events:none}
.dfoot>*{pointer-events:auto}
.dfoot #tm{font:15px 'Source Serif 4',Georgia,serif;color:#8a8a8a}
.fin{font:600 17px 'Source Serif 4',Georgia,serif;color:#fff;background:#1a1a1a;border:0;min-height:44px;padding:0 26px;border-radius:22px;cursor:pointer}
.fin:focus-visible{outline:2px solid #1a1a1a;outline-offset:3px}
body.blank #toast{background:#1a1a1a;color:#fff;font:14px 'Source Serif 4',Georgia,serif;border-radius:20px}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="hd">BRAIN DUMP</h1><span class="hs" id="hs"></span></header>
  <main id="main"></main>
  <nav id="nav" aria-label="Bereiche"></nav>
</div>
<button id="tg" class="tg" data-act="ov" aria-label="Leiste einblenden" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"/></svg></button>
<div id="toast" role="status"></div>
<script>
{
const KEY='braindump-v1';
const fresh=()=>({items:[],lists:[{id:'heute',name:'HEUTE',max:5}],draft:'',tab:'dump',cur:'heute',look:null,timer:5,batch:[],undo:[]});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const U={panel:null,pick:{},open:null,newList:false,confirm:null,timerEnd:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const find=id=>S.items.find(i=>i.id===id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(n,b=new Date())=>{const d=new Date(b);d.setDate(d.getDate()+n);return d};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const fmtD=s=>{if(!s)return'';const d=parseD(s);return WD[d.getDay()]+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'};
const stamp=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
let tz='Europe/Berlin';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}

const I={
 circle:(s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg>`,
 star:(s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>`,
 next:(s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`,
 check:(s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>`,
 dots:()=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="17" y="10" width="4" height="4"/></svg>`,
 x:()=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>`
};
const TABS=[['dump','DUMP','<path d="M4 20h4L19 9l-4-4L4 16z"/>'],['sort','SORTIEREN','<rect x="4" y="5" width="16" height="14"/><path d="M8 10h8M8 14h5"/>'],
['lists','LISTEN','<path d="M9 6h11M9 12h11M9 18h11M4 6h1M4 12h1M4 18h1"/>'],['done','ERLEDIGT','<path d="M5 12l5 5L20 7"/>'],
['opt','OPTIONEN','<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>']];

let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),2200)};

function calLink(it){
 let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(it.text);
 if(it.mark==='circle'&&it.date){const d=it.date.replace(/-/g,'');u+='&dates='+d+'/'+iso(addD(1,parseD(it.date))).replace(/-/g,'')}
 if(it.mark==='star'&&it.date&&it.time){const s=new Date(it.date+'T'+it.time);const e=new Date(s.getTime()+(it.dur||60)*60000);u+='&dates='+stamp(s)+'/'+stamp(e)+'&ctz='+encodeURIComponent(tz)}
 return u+'&details='+encodeURIComponent('Aus dem Brain Dump');
}
const subOf=it=>it.mark==='circle'?fmtD(it.date):it.mark==='star'?`${fmtD(it.date)} · ${it.time} · ${it.dur} Min`:it.mark==='next'?'Erster Schritt: '+it.next:'';
const rank=it=>({circle:0,star:1,next:2}[it.mark]??3);
const sorted=a=>a.slice().sort((x,y)=>rank(x)-rank(y)||String(x.date||'').localeCompare(String(y.date||''))||x.created-y.created);
const isToday=t=>t&&iso(new Date(t))===iso(new Date());

function renderNav(){$('#nav').innerHTML=TABS.map(([k,l,p])=>`<button data-act="tab" data-v="${k}" class="${S.tab===k?'on':''}" aria-current="${S.tab===k?'page':'false'}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">${p}</svg>${l}</button>`).join('')}

function render(){
 document.body.dataset.look=S.look||(document.documentElement.dataset.theme==='dark'?'nacht':'tag');
 document.body.classList.toggle('blank',S.tab==='dump');if(S.tab!=='dump')ovSet(false);
 renderNav();$('#hs').textContent='';
 ({dump:vDump,sort:vSort,lists:vLists,done:vDone,opt:vOpt})[S.tab]();
 $('#main').scrollTop=0;
}

/* ---------- DUMP ---------- */
function ovSet(on){U.ov=on;document.body.classList.toggle('ov',on);const t=$('#tg');t.setAttribute('aria-expanded',on);t.setAttribute('aria-label',on?'Leiste ausblenden':'Leiste einblenden')}
function vDump(){
 $('#hd').textContent='BRAIN DUMP';
 $('#main').innerHTML=`<label for="ta" style="position:absolute;left:-9999px">Gedanken</label>
  <textarea id="ta" placeholder="Was geht dir durch den Kopf?" spellcheck="true"></textarea>
  <div class="dfoot"><span id="tm"></span><button class="fin" data-act="finish">Fertig</button></div>`;
 ovSet(!!U.ov);
 const ta=$('#ta');ta.value=S.draft;tick();
 ta.addEventListener('focus',()=>{if(!ta.value){ta.value='• ';S.draft=ta.value}});
 ta.addEventListener('input',()=>{
  const p=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',p-1)+1;
  const m=v.slice(ls,p).match(/^([-*]|\d+\.)\s$/);
  if(m){ta.value=v.slice(0,ls)+'• '+v.slice(p);ta.selectionStart=ta.selectionEnd=ls+2}
  S.draft=ta.value;save();
  if(!U.timerEnd&&S.timer){U.timerEnd=Date.now()+S.timer*60000;tick()}
 });
 ta.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  e.preventDefault();
  const p=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',p-1)+1,line=v.slice(ls,p);
  if(/^•\s*$/.test(line))return;
  ta.setRangeText('\n• ',p,ta.selectionEnd,'end');S.draft=ta.value;save();
 });
}
function tick(){const t=$('#tm');if(!t)return;
 if(!S.timer){t.textContent='';return}
 if(!U.timerEnd){t.textContent=S.timer+':00';return}
 const r=Math.max(0,Math.round((U.timerEnd-Date.now())/1000));
 t.textContent=r?Math.floor(r/60)+':'+pad(r%60):'Zeit um';t.style.color=r?'':'#1a1a1a'}
setInterval(tick,1000);

/* ---------- SORTIEREN ---------- */
function vSort(){
 $('#hd').textContent='SORTIEREN';
 const q=S.items.filter(i=>i.status==='unsorted');
 const total=S.batch.length,doneN=S.batch.filter(id=>{const x=find(id);return !x||x.status!=='unsorted'}).length;
 if(total)$('#hs').textContent=doneN+' / '+total;
 if(!q.length){$('#main').innerHTML=`<div class="paper px"><div class="empty">Alles einsortiert. Dein Kopf ist leer, die Gedanken sind geparkt.</div></div>
  <div class="between"><button class="btn ghost" data-act="tab" data-v="dump">NEUER DUMP</button><button class="btn mint" data-act="tab" data-v="lists">ZU DEN LISTEN ›</button></div>`;return}
 const it=q[0];
 const boxes=total<=24?`<div class="prog" role="img" aria-label="${doneN} von ${total} sortiert">${S.batch.map((_,i)=>`<span class="${i<doneN?'f':''}"></span>`).join('')}</div>`:'';
 const mk=(k,l,c)=>`<button class="btn ${c} ${U.panel===k?'on':''}" data-act="panel" data-v="${k}">${I[k](28)}${l}</button>`;
 $('#main').innerHTML=`${boxes}
  <div class="card px"><button class="ic x" data-act="del" data-id="${it.id}" aria-label="Punkt löschen">${I.x()}</button>
   <span style="font-size:8px;color:var(--soft)">PUNKT ${Math.min(doneN+1,total||1)}${total?' VON '+total:''}</span>
   <p class="q">${esc(it.text)}</p>
   <div class="marks">${mk('circle','DATUM','sky')}${mk('star','ZEITSLOT','')}${mk('next','NÄCHSTER SCHRITT','lilac')}</div></div>
  ${panel(it)}
  <div class="between" style="margin-top:auto"><button class="btn ghost" data-act="undo" ${S.undo.length?'':'disabled'}>‹ ZURÜCK</button><button class="btn ghost" data-act="nomark">OHNE MARKE ›</button></div>`;
 const t=$('#nx');if(t)t.focus();
}
function dateChips(){const P=U.pick;const opts=[[iso(new Date()),'Heute'],[iso(addD(1)),'Morgen'],[iso(addD(2)),'Übermorgen']];
 return `<div class="chips">${opts.map(([v,l])=>`<button class="chip ${P.date===v?'on':''}" data-act="pick" data-k="date" data-v="${v}">${l}</button>`).join('')}</div>
 <label><span class="lab">ODER DATUM</span><input type="date" data-pick="date" value="${P.date||''}"></label>`}
function panel(it){
 if(!U.panel)return'';
 const P=U.pick,draft=Object.assign({},it,{mark:U.panel},P);
 if(U.panel==='circle')return `<div class="panel px"><div class="ph">${I.circle(18)}WANN?</div>${dateChips()}
  <a class="btn mint" data-act="saveCal" href="${esc(calLink(draft))}" target="_blank" rel="noopener">SPEICHERN + KALENDER ›</a>
  <button class="btn ghost" data-act="saveMark">NUR SPEICHERN</button></div>`;
 if(U.panel==='star')return `<div class="panel px"><div class="ph">${I.star(18)}WANN ERLEDIGST DU ES?</div>${dateChips()}
  <div class="two"><label><span class="lab">UHRZEIT</span><input type="time" data-pick="time" value="${P.time}"></label>
  <div><span class="lab">DAUER</span><div class="chips">${[30,60,90].map(m=>`<button class="chip ${P.dur===m?'on':''}" data-act="pick" data-k="dur" data-v="${m}">${m}</button>`).join('')}</div></div></div>
  <a class="btn mint" data-act="saveCal" href="${esc(calLink(draft))}" target="_blank" rel="noopener">SPEICHERN + KALENDER ›</a>
  <button class="btn ghost" data-act="saveMark">NUR SPEICHERN</button></div>`;
 return `<div class="panel px"><div class="ph">${I.next(18)}ERSTER SCHRITT</div>
  <label><span class="lab">VERB + DING, Z.B. „KONTOAUSZUG SUCHEN“</span><input type="text" id="nx" value="${esc(P.next||'')}" enterkeyhint="done"></label>
  <button class="btn mint" data-act="saveMark">SPEICHERN</button></div>`;
}
function settle(it,mark){
 it.status='open';it.mark=mark;
 if(mark==='circle'){it.date=U.pick.date}
 if(mark==='star'){it.date=U.pick.date;it.time=U.pick.time;it.dur=U.pick.dur}
 if(mark==='next'){it.next=U.pick.next}
 S.undo.push(it.id);U.panel=null;save();
}

/* ---------- LISTEN ---------- */
function vLists(){
 $('#hd').textContent='LISTEN';
 const open=S.items.filter(i=>i.status==='open');
 if(S.cur!=='master'&&!S.lists.some(l=>l.id===S.cur))S.cur='heute';
 const cnt=l=>open.filter(i=>i.lists.includes(l.id)).length;
 const chips=S.lists.map(l=>`<button class="chip ${S.cur===l.id?'on':''}" data-act="list" data-v="${l.id}">${esc(l.name)} ${cnt(l)}${l.max?'/'+l.max:''}</button>`).join('')
  +`<button class="chip ${S.cur==='master'?'on':''}" data-act="list" data-v="master">MASTER ${open.length}</button><button class="chip" data-act="newList" aria-label="Neue Liste">+</button>`;
 const nl=U.newList?`<div class="panel px"><label><span class="lab">NAME DER NEUEN LISTE</span><input type="text" id="nl" maxlength="16" enterkeyhint="done"></label><div class="between"><button class="btn ghost" data-act="newList">ABBRECHEN</button><button class="btn mint" data-act="mkList">ANLEGEN</button></div></div>`:'';
 let body='';
 if(S.cur==='master'){
  body=`<div class="paper px"><div class="bar"><i></i><i></i><i></i><span class="t">MASTERLISTE</span></div>${open.length?sorted(open).map(i=>row(i,'master')).join(''):'<div class="empty">Noch nichts geparkt. Starte mit einem Dump.</div>'}</div>`;
 }else{
  const L=S.lists.find(l=>l.id===S.cur);
  const inL=S.items.filter(i=>i.lists.includes(L.id)&&(i.status==='open'||(i.status==='done'&&isToday(i.doneAt))));
  const dn=inL.filter(i=>i.status==='done').length,full=L.max&&cnt(L)>=L.max;
  const cand=sorted(open.filter(i=>!i.lists.includes(L.id)));
  body=`<div class="paper px"><div class="bar"><i></i><i></i><i></i><span class="t">${esc(L.name)}</span>${L.max?`<span style="color:var(--soft)">MAX ${L.max}</span>`:''}</div>
   ${inL.length?sorted(inL.filter(i=>i.status==='open')).concat(inL.filter(i=>i.status==='done')).map(i=>row(i,'list')).join(''):'<div class="empty">Leer. Hol dir unten etwas aus der Masterliste.</div>'}</div>
   ${inL.length?`<div><span class="lab">FORTSCHRITT</span><div class="prog g" role="img" aria-label="${dn} von ${inL.length} erledigt">${inL.map((_,k)=>`<span class="${k<dn?'f':''}"></span>`).join('')}</div></div>`:''}
   <div class="panel px" style="background:var(--panel)"><span class="lab" style="margin:0">AUS DER MASTERLISTE HOLEN</span>
   ${full?`<div class="txt">${esc(L.name)} ist voll. Erst etwas erledigen, dann nachlegen.</div>`:cand.length?cand.map(i=>`<div style="display:flex;align-items:center;gap:12px;font:16px/1.35 var(--tx)">${i.mark?I[i.mark](18):'<span style="width:18px"></span>'}<span style="flex:1;overflow-wrap:anywhere">${esc(i.text)}${subOf(i)?`<span class="sub">${esc(subOf(i))}</span>`:''}</span><button class="chip" style="background:var(--mhi)" data-act="addTo" data-id="${i.id}" data-v="${L.id}" aria-label="Zu ${esc(L.name)} hinzufügen">+</button></div>`).join(''):'<div class="txt">Nichts mehr da, alles ist schon in dieser Liste.</div>'}</div>
   ${L.id!=='heute'?`<div class="end"><button class="btn ghost" data-act="delList">${U.confirm==='list'?'WIRKLICH LÖSCHEN?':'LISTE LÖSCHEN'}</button></div>`:''}`;
 }
 $('#main').innerHTML=`<div class="chips">${chips}</div>${nl}${body}`;
 if(U.newList)$('#nl').focus();
}
function row(i,ctx){
 const done=i.status==='done',sub=subOf(i);
 let acts='';
 if(U.open===i.id){
  const ls=ctx==='master'?S.lists.filter(l=>!i.lists.includes(l.id)).map(l=>`<button class="btn sky" data-act="addTo" data-id="${i.id}" data-v="${l.id}">→ ${esc(l.name)}</button>`).join(''):`<button class="btn sky" data-act="rmFrom" data-id="${i.id}">AUS LISTE NEHMEN</button>`;
  const cal=(i.mark==='circle'||i.mark==='star')?`<a class="btn mint" href="${esc(calLink(i))}" target="_blank" rel="noopener">KALENDER ›</a>`:'';
  acts=`<div class="acts">${ls}${cal}<button class="btn berry" data-act="del" data-id="${i.id}">${U.confirm===i.id?'WIRKLICH?':'LÖSCHEN'}</button></div>`;
 }
 return `<div class="row ${done?'done':''}"><button class="cb ${done?'on':''}" data-act="toggle" data-id="${i.id}" aria-label="${done?'Wieder öffnen':'Abhaken'}">${done?I.check():''}</button>
  <div class="rt"><span>${esc(i.text)}</span>${sub?`<span class="sub">${esc(sub)}</span>`:''}</div>${i.mark?`<span title="${i.mark}">${I[i.mark](18)}</span>`:''}
  <button class="ic" data-act="more" data-id="${i.id}" aria-label="Aktionen" aria-expanded="${U.open===i.id}">${I.dots()}</button></div>${acts}`;
}

/* ---------- ERLEDIGT ---------- */
function vDone(){
 $('#hd').textContent='ERLEDIGT';
 const d=S.items.filter(i=>i.status==='done').sort((a,b)=>b.doneAt-a.doneAt);
 const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
 const wk=d.filter(i=>i.doneAt>=mon.getTime()).length;
 const lbl=t=>{const s=iso(new Date(t));return s===iso(new Date())?'HEUTE':s===iso(addD(-1))?'GESTERN':fmtD(s).toUpperCase()};
 let last='',list='';
 for(const i of d){const l=lbl(i.doneAt);if(l!==last){list+=`<span class="gl">${l}</span>`;last=l}
  const t=new Date(i.doneAt);
  list+=`<div class="slip"><button class="cb on" data-act="toggle" data-id="${i.id}" aria-label="Zurückholen">${I.check()}</button><span style="flex:1;overflow-wrap:anywhere">${esc(i.text)}</span><span class="d">${pad(t.getHours())}:${pad(t.getMinutes())}</span></div>`}
 $('#main').innerHTML=`<div class="jar px"><svg width="56" height="56" viewBox="0 0 14 14" shape-rendering="crispEdges" aria-hidden="true"><rect x="3" y="0" width="8" height="2" fill="#3b2a4a"/><rect x="1" y="3" width="1" height="10" fill="#3b2a4a"/><rect x="12" y="3" width="1" height="10" fill="#3b2a4a"/><rect x="2" y="2" width="10" height="1" fill="#3b2a4a"/><rect x="2" y="13" width="10" height="1" fill="#3b2a4a"/><rect x="2" y="3" width="10" height="10" fill="#fffaf0"/>${Array.from({length:Math.min(wk,12)},(_,k)=>`<rect x="${3+(k%4)*2}" y="${11-Math.floor(k/4)*2}" width="2" height="2" fill="${['#ff6f91','#ffd166','#8ecae6','#c3a6ff'][k%4]}"/>`).join('')}</svg>
  <div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:22px">${wk}</span><span style="font-size:8px;line-height:1.6">ERLEDIGT DIESE WOCHE</span></div></div>
  <p class="txt">Dein Beweisglas. Lies drei davon, bevor du etwas Schweres anfängst.</p>
  <div style="display:flex;flex-direction:column;gap:12px">${list||'<div class="txt">Hier landet alles, was du abhakst.</div>'}</div>`;
}

/* ---------- OPTIONEN ---------- */
function vOpt(){
 $('#hd').textContent='OPTIONEN';
 const look=document.body.dataset.look;
 const ch=(act,v,l,on)=>`<button class="chip ${on?'on':''}" data-act="${act}" data-v="${v}">${l}</button>`;
 $('#main').innerHTML=`<div class="opt px"><span class="lab" style="margin:0">LOOK</span><div class="chips">${ch('look','tag','TAG',look==='tag')}${ch('look','nacht','NACHT',look==='nacht')}${ch('look','matrix','MATRIX',look==='matrix')}</div></div>
 <div class="opt px"><span class="lab" style="margin:0">DUMP-TIMER</span><div class="chips">${ch('timer',5,'5 MIN',S.timer===5)}${ch('timer',10,'10 MIN',S.timer===10)}${ch('timer',0,'AUS',!S.timer)}</div></div>
 <div class="opt px"><span class="lab" style="margin:0">SICHERUNG</span><p class="txt">Deine Daten liegen nur in diesem Browser. Kopiere ab und zu eine Sicherung, zum Beispiel in eine Notiz.</p>
  <button class="btn sky" data-act="copy">SICHERUNG KOPIEREN</button>
  <label><span class="lab">SICHERUNG EINFÜGEN</span><textarea class="f" id="imp" rows="3"></textarea></label>
  <button class="btn ghost" data-act="imp">WIEDERHERSTELLEN</button></div>
 <div class="opt px"><button class="btn berry" data-act="wipe">${U.confirm==='wipe'?'WIRKLICH ALLES LÖSCHEN?':'ALLE DATEN LÖSCHEN'}</button></div>`;
}

/* ---------- AKTIONEN ---------- */
const A={
 ov:()=>{ovSet(!U.ov)},
 tab:el=>{S.tab=el.dataset.v;U.panel=null;U.open=null;U.confirm=null;save();render()},
 finish:()=>{
  const lines=S.draft.split('\n').map(l=>l.replace(/^\s*(•|[-*]|\d+\.)\s*/,'').trim()).filter(Boolean);
  if(!lines.length){toast('Noch nichts aufgeschrieben');return}
  ovSet(false);
  const now=Date.now();
  lines.forEach((t,k)=>S.items.push({id:uid(),text:t,created:now+k,status:'unsorted',mark:null,lists:[]}));
  S.batch=S.items.filter(i=>i.status==='unsorted').map(i=>i.id);S.undo=[];
  S.draft='';U.timerEnd=null;S.tab='sort';save();render();
 },
 panel:el=>{const k=el.dataset.v;if(U.panel===k){U.panel=null}else{U.panel=k;
  const n=new Date();n.setHours(n.getHours()+1,0,0,0);
  U.pick={date:iso(new Date()),time:pad(n.getHours())+':00',dur:60,next:''}}vSort()},
 pick:el=>{const k=el.dataset.k;U.pick[k]=k==='dur'?Number(el.dataset.v):el.dataset.v;vSort()},
 saveCal:()=>{const it=S.items.find(i=>i.status==='unsorted');if(!it)return;
  if(!U.pick.date){toast('Bitte ein Datum wählen');return}
  settle(it,U.panel);setTimeout(()=>{vSort();toast('Gespeichert, Kalender geöffnet')},60)},
 saveMark:()=>{const it=S.items.find(i=>i.status==='unsorted');if(!it)return;
  if(U.panel==='next'){U.pick.next=($('#nx').value||'').trim();if(!U.pick.next){toast('Schreib den ersten Schritt auf');return}}
  else if(!U.pick.date){toast('Bitte ein Datum wählen');return}
  settle(it,U.panel);vSort()},
 nomark:()=>{const it=S.items.find(i=>i.status==='unsorted');if(!it)return;it.status='open';it.mark=null;S.undo.push(it.id);U.panel=null;save();vSort()},
 undo:()=>{const id=S.undo.pop();const it=find(id);if(it){it.status='unsorted';it.mark=null;delete it.date;delete it.time;delete it.dur;delete it.next}U.panel=null;save();vSort()},
 del:el=>{const id=el.dataset.id;
  if(S.tab!=='sort'&&U.confirm!==id){U.confirm=id;render();return}
  S.items=S.items.filter(i=>i.id!==id);S.undo=S.undo.filter(x=>x!==id);U.confirm=null;U.open=null;U.panel=null;save();render()},
 toggle:el=>{const it=find(el.dataset.id);if(!it)return;
  if(it.status==='done'){it.status='open';delete it.doneAt}else{it.status='done';it.doneAt=Date.now();toast('Erledigt. Ab ins Beweisglas!')}
  U.open=null;save();render()},
 more:el=>{U.open=U.open===el.dataset.id?null:el.dataset.id;U.confirm=null;vLists()},
 list:el=>{S.cur=el.dataset.v;U.open=null;U.confirm=null;save();vLists()},
 newList:()=>{U.newList=!U.newList;vLists()},
 mkList:()=>{const n=($('#nl').value||'').trim().toUpperCase();if(!n){toast('Gib der Liste einen Namen');return}
  const id=uid();S.lists.push({id,name:n.slice(0,16)});S.cur=id;U.newList=false;save();vLists()},
 delList:()=>{if(U.confirm!=='list'){U.confirm='list';vLists();return}
  const id=S.cur;S.lists=S.lists.filter(l=>l.id!==id);S.items.forEach(i=>i.lists=i.lists.filter(x=>x!==id));S.cur='heute';U.confirm=null;save();vLists()},
 addTo:el=>{const it=find(el.dataset.id),L=S.lists.find(l=>l.id===el.dataset.v);if(!it||!L)return;
  if(L.max&&S.items.filter(i=>i.status==='open'&&i.lists.includes(L.id)).length>=L.max){toast(L.name+' ist voll');return}
  it.lists.push(L.id);U.open=null;save();vLists();if(S.cur==='master')toast('Zu '+L.name+' hinzugefügt')},
 rmFrom:el=>{const it=find(el.dataset.id);if(it)it.lists=it.lists.filter(x=>x!==S.cur);U.open=null;save();vLists()},
 look:el=>{S.look=el.dataset.v;save();render()},
 timer:el=>{S.timer=Number(el.dataset.v);U.timerEnd=null;save();vOpt()},
 copy:async()=>{const data=JSON.stringify({v:1,items:S.items,lists:S.lists});
  try{await navigator.clipboard.writeText(data);toast('Sicherung kopiert')}catch(e){$('#imp').value=data;$('#imp').select();toast('Kopieren blockiert: Text oben markiert, bitte selbst kopieren')}},
 imp:()=>{try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.items)||!Array.isArray(d.lists))throw 0;
  S.items=d.items;S.lists=d.lists.some(l=>l.id==='heute')?d.lists:[{id:'heute',name:'HEUTE',max:5}].concat(d.lists);save();toast('Wiederhergestellt');vOpt()}catch(e){toast('Das ist keine gültige Sicherung')}},
 wipe:()=>{if(U.confirm!=='wipe'){U.confirm='wipe';vOpt();return}const look=S.look;S=fresh();S.look=look;S.tab='opt';U.confirm=null;save();render();toast('Alles gelöscht')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el,e)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.pick;if(k){U.pick[k]=e.target.value;vSort()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
 if(e.target.id==='nx'){e.preventDefault();A.saveMark()}
 if(e.target.id==='nl'){e.preventDefault();A.mkList()}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
