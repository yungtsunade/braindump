<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brain Dump</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Brain Dump">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-d2.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-d2.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* VOICE: still, aufgeräumt, wie eine leere Zeitungsseite
   IDEA: ein weißes Blatt; alles andere tritt nur auf, wenn man es braucht
   PICTURE: der Text selbst, groß gesetzt, auf Weiß
   COLOUR and TYPE: Schwarz auf Weiß, Grau für Nebensachen; Source Serif 4 überall
   LAYOUT: eine Spalte, viel Luft, feine Linien statt Kästen */
:root{--ink:#1a1a1a;--soft:#6f6f6f;--faint:#b5b5b5;--line:#e6e6e6;--wash:#f6f6f4;--serif:'Source Serif 4',Georgia,'Times New Roman',serif;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0;background:#fff}
body{background:#fff;color:var(--ink);font:17px/1.5 var(--serif);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:var(--serif)}
.app{height:100dvh;display:flex;flex-direction:column}
header{max-width:680px;width:100%;margin:0 auto;padding:calc(44px + env(safe-area-inset-top)) 24px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:32px;line-height:1.1;font-weight:600;letter-spacing:-.01em}
.hs{font-size:15px;color:var(--soft);white-space:nowrap}
main{flex:1;min-height:0;overflow-y:auto}
.wrap{max-width:680px;margin:0 auto;padding:16px 24px 40px;display:flex;flex-direction:column;gap:28px}
.lab{display:block;font-size:14px;color:var(--soft);margin-bottom:8px}
.txt{margin:0;font-size:16px;line-height:1.55;color:var(--soft)}
.empty{font-size:17px;color:var(--soft);padding:8px 0}
.sec{display:flex;flex-direction:column;gap:14px;padding-top:22px;border-top:1px solid var(--line)}
.sec h2{margin:0;font-size:19px;font-weight:600}
/* Knöpfe */
.btn{font:600 16px var(--serif);color:#fff;background:var(--ink);border:1px solid var(--ink);min-height:46px;padding:0 24px;border-radius:23px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.out{background:#fff;color:var(--ink)}
.btn.link{background:none;border-color:transparent;color:var(--ink);padding:0 4px;font-weight:400;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.btn:disabled{opacity:.35;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:15px var(--serif);color:var(--ink);background:#fff;border:1px solid #d4d4d4;min-height:40px;padding:0 16px;border-radius:20px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.end{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
:is(.btn,.chip,.cb,.ic,.mk,nav button,.tg):focus-visible{outline:2px solid var(--ink);outline-offset:3px}
input[type=text],input[type=date],input[type=time],textarea.f{font:18px var(--serif);color:var(--ink);background:#fff;border:0;border-bottom:1px solid #cfcfcf;padding:8px 0;min-height:44px;width:100%;outline:none;border-radius:0}
textarea.f{border:1px solid #cfcfcf;padding:10px;font-size:14px;resize:vertical}
input:focus,textarea.f:focus{border-color:var(--ink)}
/* Fortschritt */
.prog{height:3px;background:var(--line);position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
/* Sortieren */
.q{margin:0;font-size:30px;line-height:1.25;font-weight:400;overflow-wrap:anywhere}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft)}
.marks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 6px;background:#fff;border:1px solid #d4d4d4;border-radius:14px;font:15px/1.25 var(--serif);color:var(--ink);cursor:pointer;text-align:center}
.mk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.panel{display:flex;flex-direction:column;gap:18px;padding:22px;background:var(--wash);border-radius:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.panel input{background:transparent}
/* Listen */
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:18px;line-height:1.35}
.row .rt{flex:1;overflow-wrap:anywhere}
.tap{background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.tap>span:first-child{display:block}
.tap:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.row.done .rt>span:first-child,.row.struck .rt>span:first-child{text-decoration:line-through;color:var(--faint)}
.row.struck{touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#fff;position:relative}
.row.struck .sub{color:var(--faint)}
.task{border-bottom:1px solid var(--line)}
.task>.row{border-bottom:0}
.task>.acts{border-bottom:0}
[data-swipe]{touch-action:pan-y;user-select:none;-webkit-user-select:none;background:#fff;position:relative}
.drag{transition:none}
.step.fly,.row.fly{transition:transform .22s ease-in,opacity .22s ease-in}
@media (prefers-reduced-motion:reduce){.row.fly{transition:none}}
.sub{display:block;font-size:14px;color:var(--soft);margin-top:2px}
.mi{color:var(--soft);display:grid;place-items:center}
.cb{width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--ink);border-radius:50%;background:#fff;color:#fff;cursor:pointer;padding:0;display:grid;place-items:center}
.cb.on{background:var(--ink)}
.ic{border:0;background:transparent;color:var(--soft);width:44px;height:44px;flex:0 0 44px;cursor:pointer;display:grid;place-items:center;padding:0;margin:-8px -12px -8px 0}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 16px 40px;border-bottom:1px solid var(--line)}
.acts .btn{min-height:38px;font-size:14px;padding:0 16px}
.pick{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:17px}
.pick:last-child{border-bottom:0}
.pick .rt{flex:1;overflow-wrap:anywhere}
.qa{display:flex;align-items:center;gap:12px;min-height:52px}
.qa.open{border-bottom:1px solid #cfcfcf}
.qa.open:focus-within{border-color:var(--ink)}
.qa .add{margin-left:-5px}
.qa input[type=text]{border:0;font-size:18px}
.add{width:36px;height:36px;flex:0 0 36px;border-radius:50%;border:1px solid #d4d4d4;background:#fff;color:var(--ink);font:22px/1 var(--serif);cursor:pointer;display:grid;place-items:center;padding:0}
/* Schritte */
.steps{padding:0 0 8px 40px;display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:12px;min-height:42px;padding:4px 0;font-size:16px;line-height:1.35}
.step .st{flex:1;overflow-wrap:anywhere}
.step.done .st,.step.struck .st{text-decoration:line-through;color:var(--faint)}
.step.struck .sub{text-decoration:none;font-size:13px;color:var(--faint)}
.scb{width:22px;height:22px;flex:0 0 22px;border:1.5px solid var(--ink);border-radius:50%;background:#fff;color:#fff;cursor:pointer;padding:0;display:grid;place-items:center}
.scb.on{background:var(--ink)}
.step.done .scb{background:var(--faint);border-color:var(--faint)}
.sp{width:22px;flex:0 0 22px;text-align:center;font-size:20px;color:var(--soft)}
.addst{background:none;border:0;font:16px var(--serif);color:var(--soft);cursor:pointer;text-align:left}
.nsi{border:0!important;border-bottom:1px solid var(--ink)!important;font-size:16px!important;min-height:36px!important;padding:4px 0!important}
.psteps{padding:0 0 8px 30px;border-bottom:1px solid var(--line)}
.pick:has(+.psteps){border-bottom:0}
.pstep{display:flex;align-items:center;gap:12px;min-height:40px;font-size:16px}
.pstep .rt{flex:1;overflow-wrap:anywhere}
.add.sm{width:30px;height:30px;flex:0 0 30px;font-size:19px}
.inl{font-size:13px;color:var(--faint);white-space:nowrap}
.ph{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft)}
.stx{font:17px/1.7 var(--serif);color:var(--ink);background:transparent;border:0;outline:none;resize:vertical;min-height:110px;padding:0;width:100%}
.stx::placeholder{color:#b5b5b5}
/* Erledigt */
.big{display:flex;align-items:baseline;gap:14px}
.big b{font-size:64px;line-height:1;font-weight:600}
.big span{font-size:17px;color:var(--soft)}
.quote{margin:0;font-style:italic;font-size:18px;line-height:1.5;color:var(--soft)}
.gl{font-size:14px;color:var(--soft);margin:18px 0 2px}
.row .d{font-size:14px;color:var(--faint);white-space:nowrap}
/* Leiste */
nav{display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{font:13px var(--serif);color:#8a8a8a;background:transparent;border:0;flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0 2px}
nav button.on{color:var(--ink);font-weight:600}
/* Dump: leeres Blatt */
.tg{display:none}
#ta{display:block;width:100%;max-width:680px;height:100%;margin:0 auto;border:0;outline:none;resize:none;background:transparent;color:var(--ink);font:20px/1.7 var(--serif);padding:calc(72px + env(safe-area-inset-top)) 24px 140px;caret-color:var(--ink)}
#ta::placeholder{color:#c4c4c4}
body.blank header{display:none}
body.blank main{overflow:hidden}
body.blank .tg{display:grid;place-items:center;position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border:0;background:transparent;color:var(--faint);cursor:pointer;z-index:5}
body.blank.ov .tg{color:var(--ink)}
body.blank nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:4}
body.blank.ov nav{display:flex}
.dfoot{display:none}
body.blank.ov .dfoot{display:flex;position:fixed;right:20px;left:20px;bottom:calc(76px + env(safe-area-inset-bottom));justify-content:flex-end;align-items:center;gap:16px;z-index:4;pointer-events:none}
.dfoot>*{pointer-events:auto}
#tm{font-size:15px;color:#8a8a8a}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;font:15px var(--serif);padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:9}
#toast.s{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="app">
  <header><h1 id="hd">Brain Dump</h1><span class="hs" id="hs"></span></header>
  <main id="main"></main>
  <nav id="nav" aria-label="Bereiche"></nav>
</div>
<button id="tg" class="tg" data-act="ov" aria-label="Leiste einblenden" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 8h14M5 12h14M5 16h14"/></svg></button>
<div id="toast" role="status"></div>
<script>
{
const KEY='braindump-v1';
const fresh=()=>({items:[],lists:[{id:'heute',name:'Heute',max:5}],draft:'',tab:'dump',cur:'master',mode:'dump',seen:[],timer:5,batch:[],undo:[]});
let S;try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=fresh()}
S.lists.forEach(l=>{if(l.id==='heute'&&l.name==='HEUTE')l.name='Heute'});delete S.look;
S.tab='dump';
if(!Array.isArray(S.seen))S.seen=[];if(!S.mode)S.mode='dump';
S.items.forEach(i=>{if(i.status==='unsorted'&&!S.batch.includes(i.id))i.status='open'});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const U={panel:null,pick:{},open:null,newList:false,confirm:null,timerEnd:null,ov:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const find=id=>S.items.find(i=>i.id===id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(n,b=new Date())=>{const d=new Date(b);d.setDate(d.getDate()+n);return d};
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const fmtD=s=>{if(!s)return'';const d=parseD(s);return WD[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
const stamp=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
let tz='Europe/Berlin';try{tz=Intl.DateTimeFormat().resolvedOptions().timeZone||tz}catch(e){}

const sv=(p,s=22,w=1.6)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I={
 circle:(s,w)=>sv('<circle cx="12" cy="12" r="8"/>',s,w),
 star:(s,w)=>sv('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',s,w),
 next:(s,w)=>sv('<path d="M4 12h15M13 6l6 6-6 6"/>',s,w),
 check:(n=14)=>sv('<path d="M6 12.5l4 4L18 8"/>',n,2.6),
 steps:(s,w)=>sv('<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>',s,w),
 up:()=>sv('<path d="M6 15l6-6 6 6"/>',20,1.8),
 down:()=>sv('<path d="M6 9l6 6 6-6"/>',20,1.8),
 dots:()=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>`,
 x:()=>sv('<path d="M6 6l12 12M18 6L6 18"/>',18,1.8)
};
const TABS=[['dump','Dump','<path d="M4 20h4L19 9l-4-4L4 16z"/>'],['sort','Planen','<path d="M4 7h16M7 12h10M10 17h4"/>'],
['lists','Listen','<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="18" r=".6"/>'],['done','Erledigt','<path d="M5 12.5l4.5 4.5L19 7"/>'],
['opt','Optionen','<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>']];

let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('s');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('s'),2200)};

/* ---------- Datenmodell ----------
 Aufgabe: {id,text,created,edited?,status:'unsorted'|'open'|'done',lists:[],due?:'YYYY-MM-DD',slot?:{date,time,dur},steps:[Schritt],struck?,doneAt?}
 Schritt: {id,text,created,status:'open'|'done',lists:[],struck?,doneAt?,auto?} */
function migrate(){
 const logs=S.items.filter(i=>i.kind==='step');
 S.items=S.items.filter(i=>i.kind!=='step');
 for(const it of S.items){
  if(!Array.isArray(it.steps))it.steps=[];
  if(!Array.isArray(it.lists))it.lists=[];
  if(it.mark==='circle'&&it.date)it.due=it.date;
  if(it.mark==='star'&&it.date)it.slot={date:it.date,time:it.time||'09:00',dur:it.dur||60};
  if(it.mark==='next'&&it.next)it.steps.push({id:uid(),text:it.next,created:it.created||Date.now(),status:'open',lists:[]});
  delete it.mark;delete it.date;delete it.time;delete it.dur;delete it.next;delete it.replan;
 }
 for(const l of logs){const p=find(l.parent);
  if(p)p.steps.unshift({id:l.id,text:l.text,created:l.created,status:'done',doneAt:l.doneAt,lists:[]});
  else S.items.push({id:l.id,text:l.text,created:l.created,status:'done',doneAt:l.doneAt,lists:[],steps:[]})}
}
migrate();
if(!Array.isArray(S.undo)||S.undo.some(u=>typeof u==='string'))S.undo=[];
if(!Array.isArray(S.exp))S.exp=[];

function calLink(it,kind){
 let u='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(it.text);
 if(kind==='due'&&it.due){const d=it.due.replace(/-/g,'');u+='&dates='+d+'/'+iso(addD(1,parseD(it.due))).replace(/-/g,'')}
 if(kind==='slot'&&it.slot){const s=new Date(it.slot.date+'T'+it.slot.time);const e=new Date(s.getTime()+(it.slot.dur||60)*60000);u+='&dates='+stamp(s)+'/'+stamp(e)+'&ctz='+encodeURIComponent(tz)}
 return u+'&details='+encodeURIComponent('Aus dem Brain Dump');
}
const openSteps=it=>it.steps.filter(s=>s.status==='open');
const nextStep=it=>openSteps(it)[0];
const isPlanned=it=>!!(it.due||it.slot||openSteps(it).length);
function subOf(it){const p=[];
 if(it.due)p.push(fmtD(it.due));
 if(it.slot)p.push(`${fmtD(it.slot.date)}, ${it.slot.time} Uhr`);
 if(it.steps.length){const n=nextStep(it),dn=it.steps.filter(s=>s.status==='done').length;
  p.push(n?`→ ${n.text} · ${dn} von ${it.steps.length}`:'Alle Schritte erledigt')}
 return p.join(' · ')}
const firstDate=it=>[it.due,it.slot&&it.slot.date].filter(Boolean).sort()[0]||'';
const rank=it=>(it.due||it.slot)?0:openSteps(it).length?1:2;
const sorted=a=>a.slice().sort((x,y)=>rank(x)-rank(y)||firstDate(x).localeCompare(firstDate(y))||x.created-y.created);
const isToday=t=>t&&iso(new Date(t))===iso(new Date());
const markIc=it=>(it.due?`<span class="mi" title="Datum">${I.circle(18)}</span>`:'')+(it.slot?`<span class="mi" title="Zeitslot">${I.star(18)}</span>`:'');

function renderNav(){$('#nav').innerHTML=TABS.map(([k,l,p])=>`<button data-act="tab" data-v="${k}" class="${S.tab===k?'on':''}" aria-current="${S.tab===k?'page':'false'}">${sv(p,20,S.tab===k?2:1.6)}${l}</button>`).join('')}

function render(){
 document.body.classList.toggle('blank',S.tab==='dump');if(S.tab!=='dump')ovSet(false);
 renderNav();$('#hs').textContent='';
 ({dump:vDump,sort:vSort,lists:vLists,done:vDone,opt:vOpt})[S.tab]();
 $('#main').scrollTop=0;
}
const page=(title,html)=>{$('#hd').textContent=title;$('#main').innerHTML=`<div class="wrap">${html}</div>`};

/* Bulletpoints in Textfeldern (Dump und Schritte) */
function bulletize(ta,onChange){
 ta.addEventListener('focus',()=>{if(!ta.value){ta.value='• ';onChange()}});
 ta.addEventListener('input',()=>{
  const p=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',p-1)+1;
  if(/^([-*]|\d+\.)\s$/.test(v.slice(ls,p))){ta.value=v.slice(0,ls)+'• '+v.slice(p);ta.selectionStart=ta.selectionEnd=ls+2}
  onChange();
 });
 ta.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.shiftKey||e.isComposing)return;
  e.preventDefault();
  const p=ta.selectionStart,v=ta.value,ls=v.lastIndexOf('\n',p-1)+1;
  if(/^•\s*$/.test(v.slice(ls,p)))return;
  ta.setRangeText('\n• ',p,ta.selectionEnd,'end');onChange();
 });
}
const lines=t=>String(t||'').split('\n').map(l=>l.replace(/^\s*(•|[-*]|\d+\.)\s*/,'').trim()).filter(Boolean);

/* ---------- DUMP ---------- */
function ovSet(on){U.ov=on;document.body.classList.toggle('ov',on);const t=$('#tg');t.setAttribute('aria-expanded',on);t.setAttribute('aria-label',on?'Leiste ausblenden':'Leiste einblenden')}
function vDump(){
 $('#hd').textContent='Brain Dump';
 $('#main').innerHTML=`<label for="ta" class="sr">Gedanken</label>
  <textarea id="ta" placeholder="Was geht dir durch den Kopf?" spellcheck="true"></textarea>
  <div class="dfoot"><span id="tm"></span><button class="btn" data-act="finish">Fertig</button></div>`;

  :`<div class="qa"><button class="add" data-act="qa" aria-label="Neue Aufgabe" aria-expanded="false">+</button></div>`;

  body=(open.length?`<div class="rows">${sorted(open).map(t=>taskRow(t,'master')).join('')}</div>`:'<p class="empty">Noch nichts geparkt. Starte mit einem Dump oder tippe auf das Plus.</p>')+qa;
 }else{
  const tasks=sorted(open.filter(t=>inList(L,t)));
  const steps=[];for(const t of sorted(open))for(const s of openSteps(t))if(inList(L,s))steps.push([t,s]);
  let done=0,total=0;
  for(const t of S.items){if(inList(L,t)&&(t.status==='open'||(t.status==='done'&&isToday(t.doneAt)))){total++;if(t.status==='done'||t.struck)done++}
   for(const s of t.steps||[])if(inList(L,s)&&!s.auto&&(s.status==='open'&&t.status==='open'||(s.status==='done'&&isToday(s.doneAt)))){total++;if(s.status==='done'||s.struck)done++}}
  const full=L.max&&listCount(L)>=L.max;
  if(total)$('#hs').textContent=done+' von '+total+' erledigt';
  const rows=steps.map(([t,s])=>stepRow(t,s,L)).join('')+tasks.map(t=>taskRow(t,'list')).join('');
  body=`${total?`<div class="prog" role="img" aria-label="${done} von ${total} erledigt"><i style="width:${Math.round(done/total*100)}%"></i></div>`:''}
   ${rows?`<div class="rows">${rows}</div>`:'<p class="empty">Noch leer. Hol dir unten etwas aus der Masterliste.</p>'}${qa}
   <div class="sec"><h2>Aus der Masterliste holen</h2>${full?`<p class="txt">${esc(L.name)} ist voll. Erst etwas erledigen, dann nachlegen.</p>`:pickList(L)}</div>
   ${L.id!=='heute'?`<div class="end"><button class="btn link" data-act="delList">${U.confirm==='list'?'Wirklich löschen?':'Liste löschen'}</button></div>`:''}`;
 }
 page('Listen',`<div class="chips">${chips}</div>${nl}${body}`);
 if(U.newList)$('#nl').focus();else if(U.qaFocus){U.qaFocus=false;$('#qa').focus()}else if(U.stepFocus){U.stepFocus=false;const f=$('#ns');if(f)f.focus()}
}
function pickList(L){
 const out=[];
 for(const t of sorted(openTasks())){
  const os=openSteps(t),tIn=inList(L,t),sFree=os.filter(s=>!inList(L,s));
  if(tIn&&!sFree.length)continue;
  let h=`<div class="pick">${markIc(t)||'<span style="width:18px;flex:0 0 18px"></span>'}<span class="rt">${esc(t.text)}${t.due||t.slot?`<span class="sub">${esc(subOf(Object.assign({},t,{steps:[]})))}</span>`:''}</span>${tIn?'<span class="inl">in Liste</span>':`<button class="add" data-act="addTo" data-id="${t.id}" data-v="${L.id}" aria-label="${esc(t.text)} zu ${esc(L.name)} hinzufügen">+</button>`}</div>`;
  if(os.length)h+=`<div class="psteps">${os.map(s=>`<div class="pstep"><span class="rt">${esc(s.text)}</span>${inList(L,s)?'<span class="inl">in Liste</span>':`<button class="add sm" data-act="addTo" data-id="${t.id}" data-s="${s.id}" data-v="${L.id}" aria-label="Schritt ${esc(s.text)} zu ${esc(L.name)} hinzufügen">+</button>`}</div>`).join('')}</div>`;
  out.push(h);

function taskRow(t,ctx){

 return `<div class="task${exp?' exp':''}"><div class="row ${st?'struck':''}" ${st?`data-swipe="${t.id}"`:''}><button class="cb ${st?'on':''}" data-act="strike" data-id="${t.id}" aria-label="${st?'Nicht mehr abhaken':'Abhaken'}">${st?I.check():''}</button>

  ${hasSteps&&!st?`<button class="ic" data-act="exp" data-id="${t.id}" aria-label="${exp?'Schritte zuklappen':'Schritte aufklappen'}" aria-expanded="${exp}">${exp?I.up():I.down()}</button>`:''}

 return `<div class="step ${done?'done':''} ${st?'struck':''}" ${st?`data-swipe="${key}"`:''}><button class="scb ${done||st?'on':''}" data-act="${done?'sreopen':'sstrike'}" data-id="${t.id}" data-s="${s.id}" aria-label="${done?'Schritt wieder öffnen':st?'Nicht mehr abhaken':'Schritt abhaken'}">${done||st?I.check(11):''}</button>

function vDone(){
 const d=[];
 for(const t of S.items){if(t.status==='done')d.push({t,at:t.doneAt});for(const s of t.steps||[])if(s.status==='done'&&!s.auto)d.push({t,s,at:s.doneAt})}
 d.sort((a,b)=>b.at-a.at);
 const mon=new Date();mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
 const wk=d.filter(x=>x.at>=mon.getTime()).length;
 const lbl=t=>{const x=new Date(t),s=iso(x);return s===iso(new Date())?'Heute':s===iso(addD(-1))?'Gestern':WDL[x.getDay()]+', '+x.getDate()+'.'+(x.getMonth()+1)+'.'};
 let last='',list='';
 for(const {t,s,at} of d){const l=lbl(at);if(l!==last){list+=`${last?'</div>':''}<div class="gl">${l}</div><div class="rows">`;last=l}
  const tm=new Date(at);
  list+=`<div class="row"><button class="cb on" data-act="${s?'sreopen':'reopen'}" data-id="${t.id}" ${s?`data-s="${s.id}"`:''} aria-label="Zurückholen">${I.check()}</button><span class="rt">${esc(s?s.text:t.text)}${s?`<span class="sub">Schritt zu: ${esc(t.text)}</span>`:''}</span><span class="d">${pad(tm.getHours())}:${pad(tm.getMinutes())}</span></div>`}
 if(last)list+='</div>';
 page('Erledigt',`<div class="big"><b>${wk}</b><span>diese Woche erledigt</span></div>
  <div>${list||'<p class="empty">Hier landet alles, was du abhakst.</p>'}</div>`);
}

/* ---------- Abschließen ---------- */
function completeTask(t){
 delete t.struck;t.status='done';t.doneAt=Date.now();
 for(const s of t.steps)if(s.status==='open'){s.status='done';s.doneAt=t.doneAt;s.auto=true;delete s.struck}
 S.exp=S.exp.filter(x=>x!==t.id);toast('Erledigt. Ab ins Beweisglas.');
}
function completeStep(t,s){
 delete s.struck;s.status='done';s.doneAt=Date.now();
 toast(openSteps(t).length?'Schritt erledigt. Weiter mit: '+nextStep(t).text:'Alle Schritte erledigt');
}
function byKey(k){const [tid,sid]=String(k).split('|');const t=find(tid);return [t,sid&&t?t.steps.find(x=>x.id===sid):null]}
/* Wischen */
let sw=null,swallow=false;
document.addEventListener('pointerdown',e=>{const r=e.target.closest('[data-swipe]');if(!r||e.button>0)return;sw={r,x:e.clientX,y:e.clientY,dx:0,on:false,id:e.pointerId}});
document.addEventListener('pointermove',e=>{if(!sw||e.pointerId!==sw.id)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
 if(!sw.on){if(Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)){sw=null;return}if(dx>10&&dx>Math.abs(dy)){sw.on=true;sw.r.classList.add('drag');try{sw.r.setPointerCapture(e.pointerId)}catch(_){}}else return}
 sw.dx=Math.max(0,dx);sw.r.style.transform=`translateX(${sw.dx}px)`;sw.r.style.opacity=String(Math.max(.2,1-sw.dx/(sw.r.offsetWidth||1)))});
const swEnd=e=>{if(!sw||e.pointerId!==sw.id)return;const {r,dx,on}=sw;sw=null;if(!on)return;swallow=true;setTimeout(()=>swallow=false,0);
 r.classList.remove('drag');r.classList.add('fly');
 if(dx>r.offsetWidth*.35){r.style.transform='translateX(110%)';r.style.opacity='0';
  setTimeout(()=>{const [t,s]=byKey(r.dataset.swipe);if(t){s?completeStep(t,s):completeTask(t);save();render()}},220)}
 else{r.style.transform='';r.style.opacity='';setTimeout(()=>r.classList.remove('fly'),230)}};
document.addEventListener('pointerup',swEnd);document.addEventListener('pointercancel',swEnd);

/* ---------- AKTIONEN ---------- */
const stepOf=el=>{const t=find(el.dataset.id);return [t,t&&el.dataset.s?t.steps.find(x=>x.id===el.dataset.s):null]};
const A={
 ov:()=>{ovSet(!U.ov)},
 tab:el=>{S.tab=el.dataset.v;U.planId=null;U.pickFor=null;U.qaOpen=false;U.addStep=null;U.open=null;U.confirm=null;save();render()},
 finish:()=>{
  const ls=lines(S.draft);
  if(!ls.length){toast('Noch nichts aufgeschrieben');return}
  ovSet(false);
  const now=Date.now();
  S.items.forEach(i=>{if(i.status==='unsorted')i.status='open'});
  const fresh=ls.map((t,k)=>({id:uid(),text:t,created:now+k,status:'unsorted',lists:[],steps:[]}));
  S.items.push(...fresh);
  S.batch=fresh.map(i=>i.id);S.undo=[];S.mode='dump';S.seen=[];U.pickFor=null;
  S.draft='';U.timerEnd=null;S.tab='sort';save();render();
 },
 tile:el=>{keep();const k=el.dataset.v;if(U.sel.has(k))U.sel.delete(k);else{U.sel.add(k);if(k==='steps')U.focusSteps=true}vSort()},
 pick:el=>{keep();const k=el.dataset.k;U.pick[k]=k==='dur'?Number(el.dataset.v):el.dataset.v;vSort()},
 plan:el=>{U.planId=el.dataset.id;U.pickFor=null;U.open=null;U.confirm=null;S.tab='sort';save();render()},
 planBack:()=>{U.planId=null;U.pickFor=null;S.tab='lists';save();render()},
 savePlan:()=>{const it=curItem();if(it&&settle(it))render()},
 saveCal:(el,e)=>{const it=curItem();if(!it)return;if(!settle(it)){e.preventDefault();return}setTimeout(()=>{render();toast('Gespeichert, Kalender geöffnet')},60)},
 nomark:()=>{const it=curItem();if(!it)return;S.undo.push({id:it.id,prev:JSON.parse(JSON.stringify(it))});if(review())S.seen.push(it.id);else it.status='open';U.pickFor=null;save();vSort()},
 review:()=>{S.mode='review';S.batch=sorted(unmarked()).map(i=>i.id);S.seen=[];S.undo=[];U.pickFor=null;save();vSort()},
 undo:()=>{const u=S.undo.pop();if(u){const k=S.items.findIndex(i=>i.id===u.id);if(k>=0)S.items[k]=u.prev;if(review())S.seen=S.seen.filter(x=>x!==u.id)}U.pickFor=null;save();vSort()},
 del:el=>{const id=el.dataset.id;
  if(S.tab!=='sort'&&U.confirm!==id){U.confirm=id;render();return}
  S.items=S.items.filter(i=>i.id!==id);S.undo=S.undo.filter(u=>u.id!==id);U.confirm=null;U.open=null;U.pickFor=null;save();render()},
 strike:el=>{const t=find(el.dataset.id);if(!t)return;if(t.struck)delete t.struck;else t.struck=true;U.open=null;save();vLists()},
 sstrike:el=>{const [t,s]=stepOf(el);if(!s)return;if(s.struck)delete s.struck;else s.struck=true;U.open=null;save();vLists()},
 sreopen:el=>{const [t,s]=stepOf(el);if(!s)return;s.status='open';delete s.doneAt;delete s.auto;if(t.status==='done'){t.status='open';delete t.doneAt}save();render()},
 reopen:el=>{const t=find(el.dataset.id);if(!t)return;t.status='open';delete t.doneAt;for(const s of t.steps)if(s.auto){s.status='open';delete s.doneAt;delete s.auto}save();render()},
 finishItem:el=>{const t=find(el.dataset.id);if(t){completeTask(t);U.open=null;save();render()}},
 exp:el=>{const id=el.dataset.id;S.exp=S.exp.includes(id)?S.exp.filter(x=>x!==id):S.exp.concat(id);if(U.addStep===id)U.addStep=null;save();vLists()},
 addStep:el=>{U.addStep=el.dataset.id;U.stepFocus=true;vLists()},
 more:el=>{U.open=U.open===el.dataset.id?null:el.dataset.id;U.confirm=null;vLists()},
 list:el=>{S.cur=el.dataset.v;if(U.qaOpen)U.qaFocus=true;U.open=null;U.confirm=null;save();vLists()},
 qa:()=>{if(!U.qaOpen){U.qaOpen=true;U.qaFocus=true;vLists();return}
  const t=($('#qa').value||'').trim();if(!t){U.qaOpen=false;vLists();return}
  const it={id:uid(),text:t,created:Date.now(),status:'open',lists:[],steps:[]};S.items.push(it);
  const L=S.lists.find(l=>l.id===S.cur);
  if(L){if(L.max&&listCount(L)>=L.max)toast(L.name+' ist voll, in der Masterliste gespeichert');else it.lists.push(L.id)}
  U.qaFocus=true;save();vLists()},
 newList:()=>{U.newList=!U.newList;vLists()},
 mkList:()=>{const n=($('#nl').value||'').trim();if(!n){toast('Gib der Liste einen Namen');return}
  const id=uid();S.lists.push({id,name:n.slice(0,24)});S.cur=id;U.newList=false;save();vLists()},
 delList:()=>{if(U.confirm!=='list'){U.confirm='list';vLists();return}
  const id=S.cur;S.lists=S.lists.filter(l=>l.id!==id);S.items.forEach(i=>{i.lists=i.lists.filter(x=>x!==id);for(const s of i.steps||[])s.lists=s.lists.filter(x=>x!==id)});S.cur='master';U.confirm=null;save();vLists()},
 addTo:el=>{const [t,s]=stepOf(el),L=S.lists.find(l=>l.id===el.dataset.v),o=s||t;if(!o||!L)return;
  if(L.max&&listCount(L)>=L.max){toast(L.name+' ist voll');return}
  if(!o.lists.includes(L.id))o.lists.push(L.id);U.open=null;save();vLists();if(S.cur==='master')toast('Zu '+L.name+' hinzugefügt')},
 rmFrom:el=>{const [t,s]=stepOf(el),o=s||t;if(o)o.lists=o.lists.filter(x=>x!==S.cur);U.open=null;save();vLists()},
 timer:el=>{S.timer=Number(el.dataset.v);U.timerEnd=null;save();vOpt()},
 copy:async()=>{const data=JSON.stringify({v:2,items:S.items,lists:S.lists});
  try{await navigator.clipboard.writeText(data);toast('Sicherung kopiert')}catch(e){$('#imp').value=data;$('#imp').select();toast('Kopieren blockiert: Text ist markiert, bitte selbst kopieren')}},
 imp:()=>{try{const d=JSON.parse($('#imp').value);if(!Array.isArray(d.items)||!Array.isArray(d.lists))throw 0;
  S.items=d.items;S.lists=d.lists.some(l=>l.id==='heute')?d.lists:[{id:'heute',name:'Heute',max:5}].concat(d.lists);migrate();save();toast('Wiederhergestellt');vOpt()}catch(e){toast('Das ist keine gültige Sicherung')}},
 wipe:()=>{if(U.confirm!=='wipe'){U.confirm='wipe';vOpt();return}S=fresh();S.tab='opt';U.confirm=null;save();render();toast('Alles gelöscht')}
};
function addStepNow(){const t=find(U.addStep),v=($('#ns').value||'').trim();if(!t)return;
 if(!v){U.addStep=null;vLists();return}
 t.steps.push({id:uid(),text:v,created:Date.now(),status:'open',lists:[]});t.edited=Date.now();U.stepFocus=true;save();vLists()}
document.addEventListener('click',e=>{if(swallow){e.preventDefault();return}const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=A[el.dataset.act];if(f)f(el,e)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.pick;if(k){keep();U.pick[k]=e.target.value;vSort()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
 if(e.target.id==='nl'){e.preventDefault();A.mkList()}
 if(e.target.id==='qa'){e.preventDefault();A.qa()}
 if(e.target.id==='ns'){e.preventDefault();addStepNow()}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
